services:
  postgres:
    image: postgres:16-alpine
    container_name: aquarium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquarium
      POSTGRES_USER: aquarium
      POSTGRES_PASSWORD: aquarium_local
    ports:
      - "5432:5432"
    volumes:
      - aquarium-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarium -d aquarium"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aquarium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aquarium-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aquarium-postgres-data:
  aquarium-redis-data:
